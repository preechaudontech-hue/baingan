# ใช้สำหรับทดสอบในเครื่องเท่านั้น (รัน MongoDB จำลองในเครื่อง แทน MongoDB Atlas จริง)
# รันด้วย: docker compose -f docker-compose.local.yml up --build
services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      MONGODB_URI: "mongodb://mongo:27017/devops_worksheets"
      TEACHER_KEY: "test123"
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
