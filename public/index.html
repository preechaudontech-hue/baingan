<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คลังใบงาน</title>
<style>
body{font-family:system-ui,"Sarabun",sans-serif;max-width:720px;margin:0 auto;padding:24px 16px;background:#f7f8fa;color:#1c2330}
h1{font-size:24px}
.card{display:block;background:#fff;border:1px solid #d9dee7;border-radius:10px;padding:16px;margin:12px 0;text-decoration:none;color:inherit}
.card:hover{border-color:#3b6fd4}
.code{font-size:12px;color:#5b6678}
.t{font-weight:600;font-size:17px}
</style>
</head>
<body>
<h1>คลังใบงาน — เลือกวิชา</h1>
<div id="list">กำลังโหลด...</div>
<script>
fetch('/api/courses').then(r=>r.json()).then(cs=>{
  const el=document.getElementById('list');
  const arr=Array.isArray(cs)?cs:(cs.courses||[]);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  el.innerHTML=arr.length?arr.map(c=>`<a class="card" href="/c/${encodeURIComponent(c.code)}/"><div class="code">${esc(c.code)}</div><div class="t">${esc(c.hubTitle||c.shortName||c.code)}</div></a>`).join(''):'ยังไม่มีวิชา';
}).catch(()=>{document.getElementById('list').textContent='โหลดรายการวิชาไม่สำเร็จ'});
</script>
</body>
</html>
