<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>มุมมองครู</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f6f7f5; --surface:#ffffff; --surface-2:#eef1ee; --border:#dde2dd;
    --fg:#1b2420; --fg-muted:#5b6660; --accent:#0f6b5c; --accent-fg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11151a; --surface:#171d22; --surface-2:#1c2329; --border:#2a3238;
      --fg:#e7ede9; --fg-muted:#9aa6a0; --accent:#3ddcb0; --accent-fg:#06211b;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:'Sarabun',system-ui,sans-serif;margin:0;padding:20px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .meta{color:var(--fg-muted);font-size:13.5px;margin-bottom:18px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  select,input[type="text"]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);color:var(--fg);font-family:inherit;font-size:13.5px}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px}
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--accent)}
  .stat .l{font-size:11.5px;color:var(--fg-muted)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;overflow:hidden;font-size:13px}
  th,td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{background:var(--surface-2);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  .answer{max-width:320px;white-space:pre-wrap;word-break:break-word}
  .ss-link{color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0}
  #ssModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
  #ssModal[hidden]{display:none}
  #ssModal img{max-width:90vw;max-height:85vh;border-radius:8px}
  #ssModal .close{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none}
  .empty{padding:30px;text-align:center;color:var(--fg-muted);font-size:13.5px}
  .err{color:#c0392b;padding:16px}
  .pair-tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .steps-link{color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0}
  .steps-row td{background:var(--surface-2)}
  .steps-list{display:flex;flex-direction:column;gap:5px;font-size:12.5px;padding:4px 2px}
  .steps-list .s{display:flex;gap:7px;align-items:flex-start}
  .steps-list .mark{flex:none;font-weight:700}
  .steps-list .mark.done{color:var(--done)}
  .steps-list .mark.todo{color:var(--fg-muted)}
  .steps-list .txt{flex:1}
  .steps-list .ans{color:var(--fg-muted);margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">มุมมองครู</h1>
  <p class="meta" id="pageMeta"></p>

  <details id="rosterBox" style="margin:12px 0;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)">
    <summary style="cursor:pointer;font-weight:600">จัดการรายชื่อนักเรียนและบัญชีเข้าสู่ระบบ</summary>
    <p class="meta" style="margin:8px 0">วางรายชื่อทีละบรรทัด รูปแบบ <b>รหัสนักเรียน, ชื่อ-นามสกุล, ห้อง</b> (คั่นด้วยคอมมา หรือแท็บ จากการคัดลอกใน Excel) รายชื่อใหม่ได้รหัสผ่านเริ่มต้นเท่ากับรหัสนักเรียน รายชื่อเดิมจะอัปเดตชื่อ/ห้องโดยไม่แตะรหัสผ่าน</p>
    <textarea id="rosterText" rows="6" style="width:100%;font-family:inherit" placeholder="66001, สมชาย ใจดี, ปวช.1/1"></textarea>
    <div style="margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button id="rosterImport">นำเข้ารายชื่อ</button>
      <span id="rosterMsg" class="meta"></span>
    </div>
    <div id="rosterList" class="meta">ยังไม่ได้โหลดรายชื่อ</div>
  </details>

  <div id="content">กำลังโหลด...</div>
</div>

<div id="ssModal" hidden>
  <button class="close" id="ssClose">&times;</button>
  <img id="ssImg" src="">
</div>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const KEY = params.get('key') || '';
const API = '/api/c/' + encodeURIComponent(COURSE_CODE);
document.title = 'มุมมองครู — ' + COURSE_INFO.hubTitle;
document.getElementById('pageTitle').textContent = 'มุมมองครู — ' + COURSE_INFO.hubTitle;
document.getElementById('pageMeta').textContent = 'รายการส่งงานและสถานะการอ่านของนักเรียนทั้งหมด (' + COURSE_CODE + ')';

function stepTextFor(worksheetId, idx){
  const ws = (typeof WORKSHEETS !== 'undefined' ? WORKSHEETS : []).find(w=>w.id===worksheetId)
    || (typeof GROUP_WORKSHEETS !== 'undefined' ? GROUP_WORKSHEETS : []).find(w=>w.id===worksheetId);
  return ws && ws.steps && ws.steps[idx] ? ws.steps[idx] : ('ขั้นตอนที่ ' + (idx+1));
}

async function load(){
  const contentEl = document.getElementById('content');
  if(!KEY){
    contentEl.innerHTML = '<p class="err">ต้องเปิดหน้านี้พร้อมพารามิเตอร์ ?key=รหัสลับ ที่ครูตั้งไว้</p>';
    return;
  }
  try {
    const resp = await fetch(API + '/teacher/data?key=' + encodeURIComponent(KEY));
    if(resp.status === 403){
      contentEl.innerHTML = '<p class="err">รหัสลับไม่ถูกต้อง</p>';
      return;
    }
    if(!resp.ok) throw new Error('load failed');
    const { submissions, readMarks } = await resp.json();
    render(submissions, readMarks);
  } catch(e){
    contentEl.innerHTML = '<p class="err">โหลดข้อมูลไม่สำเร็จ: ' + e.message + '</p>';
  }
}

function render(submissions, readMarks){
  const contentEl = document.getElementById('content');
  const studentSet = new Set(submissions.map(s => s.studentName + '|' + s.studentNo)
    .concat(readMarks.map(r => r.studentName + '|' + r.studentNo)));

  let html = `
    <div class="stat-row">
      <div class="stat"><div class="n">${studentSet.size}</div><div class="l">นักเรียนที่มีกิจกรรม</div></div>
      <div class="stat"><div class="n">${submissions.length}</div><div class="l">งานที่ส่งทั้งหมด</div></div>
      <div class="stat"><div class="n">${readMarks.length}</div><div class="l">การมาร์กอ่านแล้ว</div></div>
    </div>
  `;

  if(submissions.length === 0){
    html += '<div class="empty">ยังไม่มีนักเรียนส่งงานเข้ามา</div>';
  } else {
    html += `<table><thead><tr>
      <th>เวลาส่ง</th><th>ชื่อ-นามสกุล</th><th>เลขที่</th><th>ใบงาน</th><th>คำตอบ</th><th>ขั้นตอน</th><th>ภาพแนบ</th>
    </tr></thead><tbody>`;
    submissions.forEach((s,i)=>{
      const dt = new Date(s.submittedAt).toLocaleString('th-TH');
      const isPair = s.mode === 'pair';
      const nameCell = s.mode === 'group'
        ? `${escapeHtml(s.studentName)} (${escapeHtml(s.studentNo)}) ส่งแทนทีม<br>ทีม ${escapeHtml(s.teamName || '—')}: ${(s.teamMembers||[]).map(m=>escapeHtml(m.studentName)+' ('+escapeHtml(m.studentNo)+')').join(', ')}<span class="pair-tag">ทีม</span>`
        : isPair
        ?`${escapeHtml(s.studentName)} (${escapeHtml(s.studentNo)})<br>+ ${escapeHtml(s.partnerName || '—')} (${escapeHtml(s.partnerNo || '—')})<span class="pair-tag">คู่</span>`
        : `${escapeHtml(s.studentName)}`;
      const stepAnswers = s.stepAnswers || [];
      html += `<tr>
        <td>${dt}</td>
        <td>${nameCell}</td>
        <td>${escapeHtml(s.studentNo)}</td>
        <td>${escapeHtml(s.worksheetId)}</td>
        <td class="answer">${escapeHtml(s.answerText || '')}</td>
        <td>${stepAnswers.length ? `<button class="steps-link" data-steps-idx="${i}">ดูขั้นตอน (${stepAnswers.length})</button>` : '-'}</td>
        <td>${s.screenshotCount
          ? Array.from({length: s.screenshotCount}, (_,k)=>`<button class="ss-link" data-id="${s._id}" data-i="${k}">ดูภาพ ${s.screenshotCount>1 ? (k+1) : ''}</button>`).join(' ')
          : '-'}</td>
      </tr>
      <tr class="steps-row" id="steps-row-${i}" hidden><td colspan="7">
        <div class="steps-list">
          ${stepAnswers.slice().sort((a,b)=>a.idx-b.idx).map(sa=>`
            <div class="s">
              <span class="mark ${sa.done?'done':'todo'}">${sa.done?'✓':'○'}</span>
              <span class="txt">${escapeHtml(stepTextFor(s.worksheetId, sa.idx))}<div class="ans">${escapeHtml(sa.answer || '(ยังไม่ตอบ)')}</div>${sa.imageCount ? `<div>${Array.from({length: sa.imageCount}, (_,k)=>`<button class="ss-link step-img" data-id="${s._id}" data-step="${sa.idx}" data-i="${k}">ภาพ ${k+1}</button>`).join(' ')}</div>` : ''}</span>
            </div>
          `).join('')}
        </div>
      </td></tr>`;
    });
    html += '</tbody></table>';
  }

  contentEl.innerHTML = html;

  contentEl.querySelectorAll('.steps-link').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = document.getElementById('steps-row-' + btn.dataset.stepsIdx);
      if(row) row.hidden = !row.hidden;
    });
  });

  contentEl.querySelectorAll('.step-img').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const resp = await fetch(`${API}/teacher/step-image/${btn.dataset.id}?step=${btn.dataset.step}&i=${btn.dataset.i}&key=${encodeURIComponent(KEY)}`);
      if(!resp.ok) return;
      const { image } = await resp.json();
      document.getElementById('ssImg').src = image;
      document.getElementById('ssModal').hidden = false;
    });
  });

  contentEl.querySelectorAll('.ss-link:not(.step-img)').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const resp = await fetch(`${API}/teacher/screenshot/${id}?i=${btn.dataset.i || 0}&key=${encodeURIComponent(KEY)}`);
      if(!resp.ok) return;
      const { screenshotBase64 } = await resp.json();
      document.getElementById('ssImg').src = screenshotBase64;
      document.getElementById('ssModal').hidden = false;
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('ssClose').addEventListener('click', ()=>{
  document.getElementById('ssModal').hidden = true;
});

load();

// ---------- จัดการรายชื่อ / บัญชีนักเรียน ----------
function parseRoster(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p = l.split(/\t|,/).map(x=>x.trim());
    return { studentId: p[0], name: p[1], classGroup: p[2] || '' };
  }).filter(r => r.studentId && r.name && !/^(รหัส|id|studentid)/i.test(r.studentId));
}
async function loadRoster(){
  const box = document.getElementById('rosterList');
  if(!KEY){ box.textContent = 'ต้องมี ?key= ในลิงก์'; return; }
  const r = await fetch('/api/admin/accounts?key=' + encodeURIComponent(KEY));
  if(!r.ok){ box.textContent = 'โหลดรายชื่อไม่สำเร็จ'; return; }
  const { accounts } = await r.json();
  box.innerHTML = accounts.length
    ? `<div>มีบัญชี ${accounts.length} คน (เปลี่ยนรหัสผ่านเองแล้ว ${accounts.filter(a=>a.passwordChanged).length} คน)</div>` +
      `<table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ห้อง</th><th>รหัสผ่าน</th><th></th></tr></thead><tbody>${
        accounts.map(a=>`<tr><td>${escapeHtml(a.studentId)}</td><td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.classGroup||'')}</td>
          <td>${a.passwordChanged ? 'เปลี่ยนแล้ว' : 'เริ่มต้น'}</td>
          <td><button class="acc-reset" data-id="${escapeHtml(a.studentId)}">รีเซ็ตรหัสผ่าน</button>
              <button class="acc-del" data-id="${escapeHtml(a.studentId)}">ลบ</button></td></tr>`).join('')}</tbody></table>`
    : 'ยังไม่มีบัญชีนักเรียน';
}
document.getElementById('rosterBox').addEventListener('toggle', e=>{ if(e.target.open) loadRoster(); });
document.getElementById('rosterImport').addEventListener('click', async ()=>{
  const msg = document.getElementById('rosterMsg');
  const students = parseRoster(document.getElementById('rosterText').value);
  if(!students.length){ msg.textContent = 'ไม่พบรายชื่อที่อ่านได้'; return; }
  msg.textContent = 'กำลังนำเข้า...';
  const r = await fetch('/api/admin/roster?key=' + encodeURIComponent(KEY), { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ students }) });
  if(!r.ok){ msg.textContent = 'นำเข้าไม่สำเร็จ'; return; }
  const d = await r.json();
  msg.textContent = `เสร็จแล้ว: เพิ่มใหม่ ${d.created} อัปเดต ${d.updated} ข้าม ${d.skipped}`;
  loadRoster();
});
document.getElementById('rosterList').addEventListener('click', async e=>{
  const b = e.target.closest('button');
  if(!b) return;
  const id = b.dataset.id;
  if(b.classList.contains('acc-reset')){
    if(!confirm('รีเซ็ตรหัสผ่านของ ' + id + ' กลับเป็นรหัสนักเรียน?')) return;
    await fetch('/api/admin/reset-password?key=' + encodeURIComponent(KEY), { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ studentId: id }) });
  } else if(b.classList.contains('acc-del')){
    if(!confirm('ลบบัญชี ' + id + '? (งานที่ส่งไปแล้วไม่ถูกลบ)')) return;
    await fetch('/api/admin/delete-account?key=' + encodeURIComponent(KEY), { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ studentId: id }) });
  } else return;
  loadRoster();
});
</script>
</body>
</html>
