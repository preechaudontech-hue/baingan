<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบความรู้</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f6f7f5; --surface:#ffffff; --surface-2:#eef1ee; --border:#dde2dd;
    --fg:#1b2420; --fg-muted:#5b6660; --accent:#0f6b5c; --accent-fg:#ffffff;
    --accent-soft:#e3f1ec; --warn:#a15c00; --warn-soft:#fbeedd; --info:#1f5f99; --info-soft:#e4eff9;
    --tip:#2a7a3e; --tip-soft:#e5f3e4; --code-bg:#14201c; --code-fg:#e4f1ea;
    --font-body:'Sarabun',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11151a; --surface:#171d22; --surface-2:#1c2329; --border:#2a3238;
      --fg:#e7ede9; --fg-muted:#9aa6a0; --accent:#3ddcb0; --accent-fg:#06211b;
      --accent-soft:#163229; --warn:#e0a957; --warn-soft:#2e2615; --info:#7cb8ee; --info-soft:#14283a;
      --tip:#5fd37a; --tip-soft:#163a22; --code-bg:#0b100e; --code-fg:#d6ece1;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);margin:0;padding:16px 16px 70px;line-height:1.75;font-size:16px}
  .wrap{max-width:820px;margin:0 auto}
  a{color:var(--accent)}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-size:14px}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:clamp(24px,5vw,32px);line-height:1.3;margin:4px 0 6px}
  .meta{color:var(--fg-muted);font-size:14.5px;margin:0 0 14px}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:14px 0}
  .box h3{margin:0 0 6px;font-size:15px}
  .box ul,.box ol{margin:4px 0 0;padding-left:22px}
  .toc{display:flex;flex-direction:column;gap:2px;font-size:14.5px}
  section.sec{margin-top:34px}
  section.sec h2{font-size:21px;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
  p{margin:10px 0}
  p.ref{font-size:13.5px;color:var(--fg-muted);border-left:3px solid var(--border);padding:2px 0 2px 12px;margin:14px 0}
  ul.l,ol.l{margin:8px 0;padding-left:24px}
  ul.l li,ol.l li{margin:4px 0}
  code.i{font-family:var(--font-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--border);
    border-radius:5px;padding:1px 6px;word-break:break-word}
  pre{background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:14px 16px;overflow-x:auto;
    font-family:var(--font-mono);font-size:13.5px;line-height:1.6;margin:12px 0;position:relative}
  pre .lang{position:absolute;top:6px;right:10px;font-size:11px;opacity:.55;text-transform:uppercase}
  pre code{font-family:inherit;white-space:pre}
  .note{border-radius:10px;padding:10px 16px;margin:14px 0;border:1px solid var(--border);font-size:15px}
  .note b.k{display:block;font-size:13px;margin-bottom:2px}
  .note.tip{background:var(--tip-soft);border-color:var(--tip)} .note.tip b.k{color:var(--tip)}
  .note.warn{background:var(--warn-soft);border-color:var(--warn)} .note.warn b.k{color:var(--warn)}
  .note.info{background:var(--info-soft);border-color:var(--info)} .note.info b.k{color:var(--info)}
  .tblwrap{overflow-x:auto;margin:12px 0}
  table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface)}
  th,td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
  th{background:var(--surface-2);font-weight:600}
  .summary{background:var(--accent-soft);border-color:var(--accent)}
  .terms td:first-child{font-family:var(--font-mono);font-size:13.5px;white-space:nowrap;font-weight:600}
  .questions li{margin:8px 0}
  .bottom{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .read-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--fg-muted);border-radius:9px;padding:10px 18px;
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .read-btn[data-done="true"]{background:var(--tip-soft);color:var(--tip);border-color:var(--tip)}
  .read-btn[disabled]{opacity:.6}
  .nav a{display:inline-block;padding:8px 14px;border:1px solid var(--border);border-radius:9px;text-decoration:none;font-size:14.5px;background:var(--surface)}
  .status{font-size:13px;color:var(--fg-muted)}
  .empty{padding:40px 0;text-align:center;color:var(--fg-muted)}
  @media print{ .topbar,.bottom{display:none} body{background:#fff;color:#000;padding:0} pre{border:1px solid #999;color:#000;background:#f4f4f4} }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">กำลังโหลด...</div></div>

<script src="data.js"></script>
<script>
// โหลดเฉพาะเนื้อหาของหน่วยที่เปิด แล้วค่อยเรียก render() (กำหนด KNOWLEDGE เป็นค่าเริ่มต้นกันไฟล์โหลดไม่ขึ้น)
var KNOWLEDGE = {};
(function(){
  const no = Number(new URLSearchParams(location.search).get('unit'));
  const s = document.createElement('script');
  s.src = 'knowledge.js?unit=' + encodeURIComponent(no || 0);
  const go = function(){ if(typeof render === 'function') render(); else setTimeout(go, 20); };
  s.onload = s.onerror = go;
  document.head.appendChild(s);
})();
</script>
<script>
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// ข้อความธรรมดา → HTML (escape ก่อน แล้วค่อยแปลง **หนา** และ `โค้ด`)
function inline(s){
  // เก็บส่วน `โค้ด` ไว้ก่อน (ในโค้ดอาจมีเครื่องหมาย * เช่น package*.json ที่ทำให้จับคู่ **หนา** ผิด) แล้วค่อยใส่กลับ
  const codes = [];
  let out = esc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  out = out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  out = out.replace(/\*([^*\n]+)\*/g, '<i>$1</i>');
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code class="i">${codes[Number(i)]}</code>`);
}
function getStudent(){ try { return JSON.parse(localStorage.getItem('student') || 'null'); } catch(e){ return null; } }
function loadProgress(){ try { return JSON.parse(localStorage.getItem('progress_' + COURSE_CODE) || '{}'); } catch(e){ return {}; } }
function saveProgress(p){ try { localStorage.setItem('progress_' + COURSE_CODE, JSON.stringify(p)); } catch(e){} }

function block(b){
  switch(b.t){
    case 'p': return `<p>${inline(b.x)}</p>`;
    case 'ref': return `<p class="ref"><b>อ้างอิง:</b> ${inline(b.x)}</p>`;
    case 'ul': return `<ul class="l">${b.items.map(i=>`<li>${inline(i)}</li>`).join('')}</ul>`;
    case 'ol': return `<ol class="l">${b.items.map(i=>`<li>${inline(i)}</li>`).join('')}</ol>`;
    case 'code': return `<pre>${b.lang ? `<span class="lang">${esc(b.lang)}</span>` : ''}<code>${esc(b.x)}</code></pre>`;
    case 'note': {
      const label = {tip:'เคล็ดลับ', warn:'ระวัง', info:'ข้อควรรู้'}[b.kind] || 'หมายเหตุ';
      return `<div class="note ${esc(b.kind||'info')}"><b class="k">${label}</b>${inline(b.x)}</div>`;
    }
    case 'table': return `<div class="tblwrap"><table><thead><tr>${b.head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${
      b.rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    default: return '';
  }
}

function render(){
  const app = document.getElementById('app');
  const no = Number(new URLSearchParams(location.search).get('unit'));
  const unitInfo = READ_UNITS.find(u => u.no === no);
  const k = KNOWLEDGE[no];
  if(!unitInfo){
    app.innerHTML = '<div class="empty">ไม่พบหน่วยที่ต้องการ <a href="./">กลับหน้าแรก</a></div>';
    return;
  }
  document.title = `ใบความรู้ หน่วยที่ ${no} — ${unitInfo.title}`;
  if(!k){
    app.innerHTML = `<div class="topbar"><a href="./">&larr; กลับหน้าแรก</a></div>
      <div class="eyebrow">หน่วยที่ ${no}</div><h1>${esc(unitInfo.title)}</h1>
      <div class="empty">ใบความรู้หน่วยนี้ยังไม่พร้อม</div>`;
    return;
  }

  const hasUnit = n => READ_UNITS.some(u => u.no === n);
  const prev = hasUnit(no-1) ? `<a href="learn.html?unit=${no-1}">&larr; หน่วยที่ ${no-1}</a>` : '';
  const next = hasUnit(no+1) ? `<a href="learn.html?unit=${no+1}">หน่วยที่ ${no+1} &rarr;</a>` : '';
  const done = !!loadProgress()['read_unit' + no];

  app.innerHTML = `
    <div class="topbar"><a href="./">&larr; กลับหน้าแรก (${esc(COURSE_INFO.hubTitle)})</a><span class="nav">${prev} ${next}</span></div>
    <div class="eyebrow">${esc(COURSE_CODE)} · ใบความรู้ หน่วยที่ ${no}</div>
    <h1>${esc(unitInfo.title)}</h1>
    <p class="meta">${esc(unitInfo.hours)} · ${esc(k.intro)}</p>

    <div class="box"><h3>จุดประสงค์การเรียนรู้ — เมื่ออ่านจบ นักเรียนควรทำได้ดังนี้</h3>
      <ul>${k.objectives.map(o=>`<li>${inline(o)}</li>`).join('')}</ul></div>

    <div class="box"><h3>สารบัญ</h3><div class="toc">${
      k.sections.map(s=>`<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join('')}
      <a href="#summary">สรุปสาระสำคัญ</a><a href="#terms">คำศัพท์ควรรู้</a><a href="#questions">คำถามทบทวน</a></div></div>

    ${k.sections.map(s=>`<section class="sec" id="${esc(s.id)}"><h2>${esc(s.title)}</h2>${s.blocks.map(block).join('')}</section>`).join('')}

    <section class="sec" id="summary"><h2>สรุปสาระสำคัญ</h2>
      <div class="box summary"><ul>${k.summary.map(i=>`<li>${inline(i)}</li>`).join('')}</ul></div></section>

    <section class="sec" id="terms"><h2>คำศัพท์ควรรู้</h2>
      <div class="tblwrap"><table class="terms"><thead><tr><th>คำศัพท์</th><th>ความหมาย</th></tr></thead><tbody>${
        k.terms.map(t=>`<tr><td>${esc(t[0])}</td><td>${inline(t[1])}</td></tr>`).join('')}</tbody></table></div></section>

    <section class="sec" id="questions"><h2>คำถามทบทวน</h2>
      <p>ลองตอบด้วยคำพูดของตัวเองก่อนไปทำใบงาน ถ้าตอบไม่ได้ ให้กลับไปอ่านหัวข้อที่เกี่ยวข้องอีกครั้ง</p>
      <ol class="l questions">${k.questions.map(q=>`<li>${inline(q)}</li>`).join('')}</ol></section>

    <div class="bottom">
      <div><button class="read-btn" id="readBtn" data-done="${done}">${done ? '✓ อ่านแล้ว' : 'มาร์กว่าอ่านแล้ว'}</button>
        <div class="status" id="readStatus"></div></div>
      <span class="nav">${prev} ${next}</span>
    </div>`;

  document.getElementById('readBtn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget, st = document.getElementById('readStatus');
    const student = getStudent();
    if(!student){ st.textContent = 'กลับไปหน้าแรกเพื่อกรอกชื่อและเลขที่ก่อน จึงจะบันทึกได้'; return; }
    btn.disabled = true; st.textContent = '';
    try{
      const resp = await fetch('/api/c/' + encodeURIComponent(COURSE_CODE) + '/read', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ studentName: student.studentName, studentNo: student.studentNo, unitNo: no }) });
      if(!resp.ok) throw new Error('failed');
      const p = loadProgress(); p['read_unit' + no] = true; saveProgress(p);
      btn.dataset.done = 'true'; btn.textContent = '✓ อ่านแล้ว';
    } catch(err){ st.textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'; }
    finally { btn.disabled = false; }
  });
}
</script>
</body>
</html>
